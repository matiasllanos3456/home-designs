<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .wall { fill: none; stroke: #000; stroke-width: 4; }
      .door { fill: none; stroke: #8B4513; stroke-width: 3; }
      .window { fill: none; stroke: #4682B4; stroke-width: 3; }
      .text { font-family: Arial, sans-serif; font-size: 16px; fill: #333; }
      .text-small { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .area-label { font-family: Arial, sans-serif; font-size: 14px; fill: #000; font-weight: bold; }
      .furniture { fill: none; stroke: #999; stroke-width: 2; stroke-dasharray: 3,3; }
      .floor { fill: #f5f5f5; stroke: none; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" style="font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #000;">Plano Interior de la Casa</text>
  <text x="600" y="55" text-anchor="middle" class="text-small">Basado en la foto exterior - Diseño de una planta</text>
  
  <!-- Outer walls -->
  <rect class="floor" x="100" y="100" width="1000" height="600"/>
  <rect class="wall" x="100" y="100" width="1000" height="600"/>
  
  <!-- GARAJE (Left side) -->
  <rect class="wall" x="100" y="100" width="300" height="300"/>
  <text x="250" y="240" text-anchor="middle" class="area-label">GARAJE</text>
  <text x="250" y="260" text-anchor="middle" class="text-small">5.5m x 5.5m</text>
  
  <!-- Garage door (front) -->
  <line class="door" x1="150" y1="100" x2="350" y2="100" stroke-width="6"/>
  <text x="250" y="120" text-anchor="middle" class="text-small">Puerta de garaje</text>
  
  <!-- Door from garage to house -->
  <line class="door" x1="400" y1="250" x2="400" y2="300"/>
  <path class="door" d="M 400 250 Q 380 265 400 280"/>
  
  <!-- SALA DE ESTAR / LIVING (Center front) -->
  <rect class="wall" x="400" y="100" width="400" height="300"/>
  <text x="600" y="240" text-anchor="middle" class="area-label">SALA DE ESTAR</text>
  <text x="600" y="260" text-anchor="middle" class="text-small">7.3m x 5.5m</text>
  
  <!-- Front entrance door (center) -->
  <line class="door" x1="570" y1="100" x2="630" y2="100" stroke-width="5"/>
  <path class="door" d="M 570 100 Q 585 120 600 100"/>
  <text x="600" y="120" text-anchor="middle" class="text-small">Entrada principal</text>
  
  <!-- Front windows (living room) -->
  <line class="window" x1="440" y1="100" x2="520" y2="100"/>
  <text x="480" y="90" text-anchor="middle" class="text-small" style="font-size: 10px;">Ventana</text>
  
  <line class="window" x1="680" y1="100" x2="760" y2="100"/>
  <text x="720" y="90" text-anchor="middle" class="text-small" style="font-size: 10px;">Ventana</text>
  
  <!-- Sofa representation -->
  <rect class="furniture" x="450" y="150" width="150" height="60"/>
  <text x="525" y="185" text-anchor="middle" class="text-small" style="font-size: 10px;">Sofá</text>
  
  <!-- Coffee table -->
  <rect class="furniture" x="520" y="230" width="80" height="50"/>
  
  <!-- DORMITORIO 1 (Right front) -->
  <rect class="wall" x="800" y="100" width="300" height="300"/>
  <text x="950" y="240" text-anchor="middle" class="area-label">DORMITORIO 1</text>
  <text x="950" y="260" text-anchor="middle" class="text-small">5.5m x 5.5m</text>
  
  <!-- Window dormitorio 1 -->
  <line class="window" x1="1000" y1="100" x2="1080" y2="100"/>
  <text x="1040" y="90" text-anchor="middle" class="text-small" style="font-size: 10px;">Ventana</text>
  
  <!-- Bed representation -->
  <rect class="furniture" x="850" y="150" width="90" height="120"/>
  <text x="895" y="215" text-anchor="middle" class="text-small" style="font-size: 10px;">Cama</text>
  
  <!-- Closet -->
  <rect class="furniture" x="1000" y="150" width="80" height="40"/>
  <text x="1040" y="175" text-anchor="middle" class="text-small" style="font-size: 10px;">Closet</text>
  
  <!-- COCINA Y COMEDOR (Left back) -->
  <rect class="wall" x="100" y="400" width="400" height="300"/>
  <text x="300" y="540" text-anchor="middle" class="area-label">COCINA Y COMEDOR</text>
  <text x="300" y="560" text-anchor="middle" class="text-small">7.3m x 5.5m</text>
  
  <!-- Window cocina -->
  <line class="window" x1="100" y1="500" x2="100" y2="580"/>
  
  <!-- Kitchen counter -->
  <rect class="furniture" x="120" y="420" width="200" height="40"/>
  <text x="220" y="445" text-anchor="middle" class="text-small" style="font-size: 10px;">Mesada cocina</text>
  
  <!-- Dining table -->
  <rect class="furniture" x="200" y="600" width="120" height="80"/>
  <text x="260" y="645" text-anchor="middle" class="text-small" style="font-size: 10px;">Mesa comedor</text>
  
  <!-- Door from living to kitchen -->
  <line class="door" x1="400" y1="350" x2="400" y2="400"/>
  <path class="door" d="M 400 350 Q 420 365 400 380"/>
  
  <!-- BAÑO 1 (Center back) -->
  <rect class="wall" x="500" y="400" width="200" height="150"/>
  <text x="600" y="470" text-anchor="middle" class="area-label">BAÑO 1</text>
  <text x="600" y="490" text-anchor="middle" class="text-small">3.6m x 2.7m</text>
  
  <!-- Door to bathroom 1 -->
  <line class="door" x1="650" y1="400" x2="700" y2="400"/>
  <path class="door" d="M 650 400 Q 665 420 680 400"/>
  
  <!-- Toilet -->
  <circle class="furniture" cx="550" cy="450" r="15"/>
  <text x="550" y="455" text-anchor="middle" class="text-small" style="font-size: 8px;">WC</text>
  
  <!-- Shower -->
  <rect class="furniture" x="610" y="420" width="70" height="70"/>
  <text x="645" y="460" text-anchor="middle" class="text-small" style="font-size: 10px;">Ducha</text>
  
  <!-- Sink -->
  <rect class="furniture" x="530" y="510" width="40" height="25"/>
  <text x="550" y="535" text-anchor="middle" class="text-small" style="font-size: 8px;">Lavabo</text>
  
  <!-- DORMITORIO 2 (Center back right) -->
  <rect class="wall" x="500" y="550" width="300" height="150"/>
  <text x="650" y="620" text-anchor="middle" class="area-label">DORMITORIO 2</text>
  <text x="650" y="640" text-anchor="middle" class="text-small">5.5m x 2.7m</text>
  
  <!-- Door to dormitorio 2 -->
  <line class="door" x1="550" y1="550" x2="600" y2="550"/>
  <path class="door" d="M 550 550 Q 565 570 580 550"/>
  
  <!-- Bed in dormitorio 2 -->
  <rect class="furniture" x="520" y="580" width="80" height="100"/>
  <text x="560" y="635" text-anchor="middle" class="text-small" style="font-size: 10px;">Cama</text>
  
  <!-- Window dormitorio 2 -->
  <line class="window" x1="700" y1="700" x2="780" y2="700"/>
  
  <!-- DORMITORIO PRINCIPAL / MASTER (Right back) -->
  <rect class="wall" x="800" y="400" width="300" height="300"/>
  <text x="950" y="540" text-anchor="middle" class="area-label">DORMITORIO</text>
  <text x="950" y="560" text-anchor="middle" class="area-label">PRINCIPAL</text>
  <text x="950" y="580" text-anchor="middle" class="text-small">5.5m x 5.5m</text>
  
  <!-- Door to master bedroom -->
  <line class="door" x1="800" y1="450" x2="800" y2="500"/>
  <path class="door" d="M 800 450 Q 820 465 800 480"/>
  
  <!-- Master bed -->
  <rect class="furniture" x="1000" y="450" width="80" height="120"/>
  <text x="1040" y="515" text-anchor="middle" class="text-small" style="font-size: 10px;">Cama king</text>
  
  <!-- Master closet -->
  <rect class="furniture" x="820" y="620" width="100" height="40"/>
  <text x="870" y="645" text-anchor="middle" class="text-small" style="font-size: 10px;">Closet</text>
  
  <!-- Window master bedroom -->
  <line class="window" x1="1100" y1="500" x2="1100" y2="600"/>
  <text x="1085" y="550" text-anchor="middle" class="text-small" style="font-size: 10px; writing-mode: tb;">Ventana</text>
  
  <!-- BAÑO EN SUITE (Master bathroom) -->
  <line class="wall" x1="950" y1="620" x2="950" y2="700"/>
  <line class="wall" x1="950" y1="620" x2="1100" y2="620"/>
  
  <text x="1025" y="660" text-anchor="middle" class="area-label" style="font-size: 12px;">BAÑO</text>
  <text x="1025" y="677" text-anchor="middle" class="area-label" style="font-size: 12px;">EN SUITE</text>
  
  <!-- Door to bathroom en suite -->
  <line class="door" x1="950" y1="640" x2="950" y2="680"/>
  <path class="door" d="M 950 640 Q 970 655 950 670"/>
  
  <!-- Toilet en suite -->
  <circle class="furniture" cx="980" cy="650" r="12"/>
  <text x="980" y="653" text-anchor="middle" class="text-small" style="font-size: 8px;">WC</text>
  
  <!-- Shower en suite -->
  <rect class="furniture" x="1020" y="635" width="60" height="50"/>
  <text x="1050" y="665" text-anchor="middle" class="text-small" style="font-size: 8px;">Ducha</text>
  
  <!-- Internal walls -->
  <!-- Garage to living wall -->
  <line class="wall" x1="400" y1="100" x2="400" y2="400"/>
  
  <!-- Living to dormitorio 1 wall -->
  <line class="wall" x1="800" y1="100" x2="800" y2="400"/>
  
  <!-- Top section horizontal wall -->
  <line class="wall" x1="100" y1="400" x2="1100" y2="400"/>
  
  <!-- Kitchen to bathroom wall -->
  <line class="wall" x1="500" y1="400" x2="500" y2="700"/>
  
  <!-- Bathroom 1 to dormitorio 2 wall -->
  <line class="wall" x1="500" y1="550" x2="800" y2="550"/>
  
  <!-- Bathroom walls -->
  <line class="wall" x1="700" y1="400" x2="700" y2="550"/>
  
  <!-- Master bedroom wall -->
  <line class="wall" x1="800" y1="400" x2="800" y2="700"/>
  
  <!-- Legend -->
  <g transform="translate(100, 730)">
    <text x="0" y="0" class="text-small" style="font-weight: bold;">Leyenda:</text>
    <line class="wall" x1="70" y1="-5" x2="110" y2="-5"/>
    <text x="120" y="0" class="text-small">Muro</text>
    
    <line class="door" x1="200" y1="-5" x2="240" y2="-5"/>
    <text x="250" y="0" class="text-small">Puerta</text>
    
    <line class="window" x1="330" y1="-5" x2="370" y2="-5"/>
    <text x="380" y="0" class="text-small">Ventana</text>
    
    <line class="furniture" x1="470" y1="-5" x2="510" y2="-5"/>
    <text x="520" y="0" class="text-small">Muebles</text>
  </g>
  
  <!-- Dimensions note -->
  <text x="1050" y="760" text-anchor="end" class="text-small" style="font-style: italic;">Área total aproximada: 180 m²</text>
</svg>
